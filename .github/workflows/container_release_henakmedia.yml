# henakmedia fork container builder -> Harbor.
#
# Builds the EC 4+2 fork's `weed` binary as a linux amd64 + arm64 container
# image and publishes it to the homelab Harbor registry. The result is what
# the k3s fleet's SeaweedFS manifests pin (all master/volume/filer/s3 pods
# MUST run this image — stock chrislusf images cannot decode EC 4+2 volumes).
#
# The upstream release workflows (container_release_unified.yml,
# container_release_foundationdb.yml, container_latest.yml, container_dev.yml)
# were removed/kept-out because they push to ghcr.io/chrislusf/seaweedfs,
# which a fork cannot publish to, and the unified/foundationdb ones fire on
# ANY tag push and stampeded the fork's releases.
#
# Triggers:
#   - MANUAL via Actions tab ("Run workflow", pick an image_tag). Primary.
#   - push of a tag matching henak-container-v* (automation).
#
# Secrets (set in the fork repo, Actions -> Secrets and variables):
#   HARBOR_URL        e.g. harbor.henak.io        (no scheme, no path)
#   HARBOR_USERNAME   e.g. robot$henak-ci         (Harbor robot account,
#                                                  project="library", push)
#   HARBOR_TOKEN      the robot account's token
#
# Image published: harbor.henak.io/library/seaweedfs:<image_tag>  (multi-arch)

name: "docker: build container for henakmedia (EC 4+2) -> Harbor"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish (e.g. v4.47-henak.1)"
        required: false
        default: "v4.47-henak.1"
  push:
    tags:
      - 'henak-container-v*'

permissions:
  contents: read

env:
  IMAGE: harbor.henak.io/library/seaweedfs

jobs:

  build:
    name: "build weed (${{ matrix.arch }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          # arm64 build happens natively on ubuntu-24.04-arm; QEMU is a no-op there.
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to Harbor
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.3.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Compute release tag
        id: release
        run: |
          input="${{ inputs.image_tag || github.ref_name }}"
          # Normalize henak-container-v4.47-henak.1 -> v4.47-henak.1
          release="${input#henak-container-}"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: docker/Dockerfile.henak
          # Native build per platform (no QEMU cross-compile inside the image).
          platforms: ${{ matrix.platform }}
          push: true
          # Per-arch tag while building; merged into the multi-arch tag after.
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.release }}-${{ matrix.arch }}

  merge:
    name: "merge multi-arch manifest"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute release tag
        id: release
        run: |
          input="${{ inputs.image_tag || github.ref_name }}"
          release="${input#henak-container-}"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.3.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE }}:${{ steps.release.outputs.release }}" \
            "${{ env.IMAGE }}:${{ steps.release.outputs.release }}-amd64" \
            "${{ env.IMAGE }}:${{ steps.release.outputs.release }}-arm64"

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.IMAGE }}:${{ steps.release.outputs.release }}"